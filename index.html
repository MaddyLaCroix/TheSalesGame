<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Sales Game</title>

<style>


:root {
    --leaf-green: #10260F;
    --vibrant-green: #4AAC00;
    --lime: #ACED7B;
    --stone: #F2EEE6;
    --white: #FFFFFF;
    --black: #000000;
    --orange: #FF5524;
}

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    max-width: 950px;
    margin: 0 auto;
    padding: 30px 20px;
    color: var(--leaf-green);
    background: var(--stone);
}

.card {
    overflow: hidden;
    border-radius: 18px;
    background: var(--white);
    box-shadow: 0 10px 30px rgba(16, 38, 15, 0.18);
}

.header {
    padding: 30px;
    color: var(--white);
    background: var(--leaf-green);
    text-align: center;
}

.header h1 {
    margin: 0 0 8px;
    font-size: 34px;
}

.header p {
    margin: 0;
    color: var(--lime);
    font-size: 16px;
}

.content {
    padding: 30px;
}

/* DIFFICULTY SETTINGS */

.difficulty-section {
    margin-bottom: 28px;
    text-align: center;
}

.difficulty-section h2 {
    margin: 0 0 15px;
    font-size: 20px;
}

.difficulty-options {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.difficulty-option input {
    position: absolute;
    opacity: 0;
}

.difficulty-option label {
    display: inline-block;
    min-width: 125px;
    padding: 13px 22px;
    border: 2px solid var(--leaf-green);
    border-radius: 50px;
    color: var(--leaf-green);
    background: var(--white);
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s ease;
}

.difficulty-option label:hover {
    color: var(--white);
    background: var(--leaf-green);
    transform: translateY(-2px);
}

#easy:checked + label {
    border-color: var(--vibrant-green);
    color: var(--leaf-green);
    background: var(--lime);
}

#medium:checked + label {
    border-color: var(--leaf-green);
    color: var(--white);
    background: var(--vibrant-green);
}

#hard:checked + label {
    border-color: var(--orange);
    color: var(--white);
    background: var(--orange);
}

/* RANDOMIZER BOXES */

.results {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px;
}

.box {
    display: flex;
    flex-direction: column;
    padding: 22px;
    border: 2px solid var(--lime);
    border-radius: 14px;
    background: var(--stone);
    text-align: center;
}

.box h2 {
    margin: 0 0 16px;
    color: var(--leaf-green);
    font-size: 20px;
}

/* THE TEXT SPINS INSIDE THIS BOX */

.result-window {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 145px;
    margin-bottom: 18px;
    padding: 20px;
    overflow: hidden;
    border: 3px solid var(--leaf-green);
    border-radius: 12px;
    background: var(--white);
}

.result-window::before,
.result-window::after {
    content: "";
    position: absolute;
    right: 0;
    left: 0;
    z-index: 2;
    height: 30px;
    pointer-events: none;
}

.result-window::before {
    top: 0;
    background: linear-gradient(
        to bottom,
        var(--white),
        rgba(255, 255, 255, 0)
    );
}

.result-window::after {
    bottom: 0;
    background: linear-gradient(
        to top,
        var(--white),
        rgba(255, 255, 255, 0)
    );
}

.result {
    position: relative;
    z-index: 1;
    width: 100%;
    color: var(--leaf-green);
    font-size: 25px;
    font-weight: bold;
    line-height: 1.3;
    overflow-wrap: anywhere;
}

/* ACTIVE SPIN EFFECT */

.result.spinning {
    color: var(--vibrant-green);
    animation: textFlip 0.11s linear infinite;
}

@keyframes textFlip {
    0% {
        opacity: 0.25;
        transform: translateY(-16px);
    }

    50% {
        opacity: 1;
        transform: translateY(0);
    }

    100% {
        opacity: 0.25;
        transform: translateY(16px);
    }
}

/* FINAL LANDING EFFECT */

.result.landed {
    animation: landed 0.45s ease;
}

@keyframes landed {
    0% {
        transform: scale(0.85);
    }

    55% {
        transform: scale(1.10);
    }

    100% {
        transform: scale(1);
    }
}

/* BUTTONS */

button {
    width: 100%;
    padding: 14px 20px;
    border: 2px solid var(--leaf-green);
    border-radius: 8px;
    color: var(--white);
    background: var(--leaf-green);
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s ease;
}

button:hover:not(:disabled) {
    border-color: var(--vibrant-green);
    background: var(--vibrant-green);
    transform: translateY(-2px);
}

button:active:not(:disabled) {
    transform: translateY(0);
}

button:disabled {
    cursor: not-allowed;
    opacity: 0.55;
}

.customer-button {
    border-color: var(--vibrant-green);
    background: var(--vibrant-green);
}

.customer-button:hover:not(:disabled) {
    border-color: var(--leaf-green);
    background: var(--leaf-green);
}

/* HISTORY */

.history {
    margin-top: 30px;
    padding-top: 25px;
    border-top: 2px solid var(--lime);
}

.history-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 15px;
}

.history-heading h2 {
    margin: 0;
}

.clear-button {
    width: auto;
    padding: 9px 15px;
    border-color: var(--leaf-green);
    color: var(--leaf-green);
    background: var(--white);
    font-size: 14px;
}

.clear-button:hover:not(:disabled) {
    color: var(--white);
    background: var(--leaf-green);
}

.history-empty {
    padding: 20px;
    border-radius: 8px;
    color: #536052;
    background: var(--stone);
    text-align: center;
}

.history-item {
    display: grid;
    grid-template-columns: 38px 1fr 1fr;
    gap: 14px;
    align-items: center;
    padding: 13px;
    border-bottom: 1px solid #d5ddcf;
}

.history-number {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    color: var(--leaf-green);
    background: var(--lime);
    font-weight: bold;
}

.history-label {
    display: block;
    margin-bottom: 3px;
    color: #647063;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
}

.history-value {
    color: var(--leaf-green);
    font-weight: bold;
}

.difficulty-badge {
    display: inline-block;
    margin-left: 6px;
    padding: 3px 7px;
    border-radius: 20px;
    color: var(--white);
    background: var(--vibrant-green);
    font-size: 10px;
    text-transform: uppercase;
}

.footer-note {
    margin: 25px 0 0;
    color: #647063;
    font-size: 13px;
    text-align: center;
}

@media (max-width: 700px) {

    body {
        padding: 15px;
    }

    .header {
        padding: 24px 15px;
    }

    .header h1 {
        font-size: 27px;
    }

    .content {
        padding: 20px;
    }

    .results {
        grid-template-columns: 1fr;
    }

    .difficulty-option {
        width: 100%;
    }

    .difficulty-option label {
        width: 100%;
    }

    .history-item {
        grid-template-columns: 38px 1fr;
    }

    .history-customer {
        grid-column: 2;
    }
}

</style>
</head>

<body>

<div class="card">

    <header class="header">
        <h1>Sales Scenario Randomizer</h1>
        <p>Choose your challenge and practice your pitch.</p>
    </header>

    <main class="content">

        <section class="difficulty-section">

            <h2>Choose Item Difficulty</h2>

            <div class="difficulty-options">

                <div class="difficulty-option">
                    <input
                        type="radio"
                        id="easy"
                        name="difficulty"
                        value="easy"
                        checked
                    >
                    <label for="easy">Easy</label>
                </div>

                <div class="difficulty-option">
                    <input
                        type="radio"
                        id="medium"
                        name="difficulty"
                        value="medium"
                    >
                    <label for="medium">Medium</label>
                </div>

                <div class="difficulty-option">
                    <input
                        type="radio"
                        id="hard"
                        name="difficulty"
                        value="hard"
                    >
                    <label for="hard">Hard</label>
                </div>

            </div>

        </section>

        <section class="results">

            <div class="box">

                <h2>What You're Selling</h2>

                <div class="result-window">
                    <div class="result" id="productResult">
                        Click Generate
                    </div>
                </div>

                <button
                    type="button"
                    id="productButton"
                    onclick="generateProduct()"
                >
                    Spin Product
                </button>

            </div>

            <div class="box">

                <h2>Who You're Selling To</h2>

                <div class="result-window">
                    <div class="result" id="customerResult">
                        Click Generate
                    </div>
                </div>

                <button
                    type="button"
                    id="customerButton"
                    class="customer-button"
                    onclick="generateCustomer()"
                >
                    Spin Customer
                </button>

            </div>

        </section>

        <section class="history">

            <div class="history-heading">
                <h2>Last 10 Scenarios</h2>

                <button
                    type="button"
                    class="clear-button"
                    onclick="clearHistory()"
                >
                    Clear History
                </button>
            </div>

            <div id="historyArea" class="history-empty">
                No scenarios yet.
            </div>

        </section>

        <p class="footer-note">
            Each list completes a full no-repeat cycle before it reshuffles.
        </p>

    </main>

</div>

<script>

/* ==========================================================
   EDIT LISTS HERE
========================================================== */

const easyProducts = [
    "LeafFilter",
    "Leaf Home Water Solutions",
    "Windows",
    "Doors"
];

const mediumProducts = [
    "Solar Panels",
    "Home Security System",
    "Whole Home Generator",
    "A Remote That Can Control All Home Devices (There are a LOT of buttons)"
];

const hardProducts = [
    "Wacky Arm-Flailing Inflatable Tube Man",
    "A Rubber Duck",
    "A Really Nice Slinky",
    "A Snow Shovel in Florida",
    "An Empty Box"
];

const customerTypes = [
    "A mom who is kind of distracted by her young kids",
    "A old man who is hard of hearing",
    "An overnight nurse who's sleep you've interupted",
    "A really grumpy guy who want's to get back to watching the game",
    "A 22-year-old who has no clue what it is you're selling"
];

/* ==========================================================
   DO NOT EDIT BELOW THIS LINE
========================================================== */

let currentProduct = "";
let currentCustomer = "";
let currentDifficulty = "";

let historyList = [];

let remainingEasy = [];
let remainingMedium = [];
let remainingHard = [];
let remainingCustomers = [];

let productIsSpinning = false;
let customerIsSpinning = false;

function shuffle(array) {

    const copy = [...array];

    for (let i = copy.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [copy[i], copy[j]] = [copy[j], copy[i]];
    }

    return copy;
}

function getDifficulty() {

    return document.querySelector(
        'input[name="difficulty"]:checked'
    ).value;
}

function getProductPool(difficulty) {

    if (difficulty === "easy") {

        if (remainingEasy.length === 0) {
            remainingEasy = shuffle(easyProducts);
        }

        return remainingEasy;
    }

    if (difficulty === "medium") {

        if (remainingMedium.length === 0) {
            remainingMedium = shuffle(mediumProducts);
        }

        return remainingMedium;
    }

    if (remainingHard.length === 0) {
        remainingHard = shuffle(hardProducts);
    }

    return remainingHard;
}

function getFullProductList(difficulty) {

    if (difficulty === "easy") {
        return easyProducts;
    }

    if (difficulty === "medium") {
        return mediumProducts;
    }

    return hardProducts;
}

/*
This creates the wheel-like text cycling effect.

The text changes quickly at first and then gradually slows
before landing on the final no-repeat result.
*/

function animateText(element, previewList, finalValue, callback) {

    element.classList.remove("landed");
    element.classList.add("spinning");

    let spinCount = 0;
    const totalSpins = 22;

    function showNextOption() {

        const randomPreview =
            previewList[
                Math.floor(Math.random() * previewList.length)
            ];

        element.textContent = randomPreview;

        spinCount++;

        if (spinCount < totalSpins) {

            /*
            The delay grows with each cycle, creating
            the slowing wheel effect.
            */

            const delay = 45 + Math.pow(spinCount, 1.7);

            setTimeout(showNextOption, delay);

        } else {

            element.classList.remove("spinning");
            element.textContent = finalValue;

            void element.offsetWidth;

            element.classList.add("landed");

            if (callback) {
                callback();
            }
        }
    }

    showNextOption();
}

function generateProduct() {

    if (productIsSpinning) {
        return;
    }

    const difficulty = getDifficulty();
    const previewList = getFullProductList(difficulty);
    const pool = getProductPool(difficulty);

    if (previewList.length === 0) {
        alert("There are no products in the selected difficulty list.");
        return;
    }

    productIsSpinning = true;

    const productButton =
        document.getElementById("productButton");

    productButton.disabled = true;
    productButton.textContent = "Spinning...";

    const selectedProduct = pool.pop();

    animateText(
        document.getElementById("productResult"),
        previewList,
        selectedProduct,
        function () {

            currentProduct = selectedProduct;
            currentDifficulty = difficulty;

            productIsSpinning = false;

            productButton.disabled = false;
            productButton.textContent = "Spin Product";

            updateHistory();
        }
    );
}

function generateCustomer() {

    if (customerIsSpinning) {
        return;
    }

    if (customerTypes.length === 0) {
        alert("There are no customer types in the customer list.");
        return;
    }

    if (remainingCustomers.length === 0) {
        remainingCustomers = shuffle(customerTypes);
    }

    customerIsSpinning = true;

    const customerButton =
        document.getElementById("customerButton");

    customerButton.disabled = true;
    customerButton.textContent = "Spinning...";

    const selectedCustomer = remainingCustomers.pop();

    animateText(
        document.getElementById("customerResult"),
        customerTypes,
        selectedCustomer,
        function () {

            currentCustomer = selectedCustomer;

            customerIsSpinning = false;

            customerButton.disabled = false;
            customerButton.textContent = "Spin Customer";

            updateHistory();
        }
    );
}

function updateHistory() {

    if (currentProduct === "" || currentCustomer === "") {
        return;
    }

    const entry = {
        product: currentProduct,
        customer: currentCustomer,
        difficulty: currentDifficulty
    };

    historyList.unshift(entry);
    historyList = historyList.slice(0, 10);

    saveHistory();
    renderHistory();
}

function renderHistory() {

    const historyArea =
        document.getElementById("historyArea");

    if (historyList.length === 0) {

        historyArea.className = "history-empty";
        historyArea.textContent = "No scenarios yet.";

        return;
    }

    historyArea.className = "";

    let html = "";

    historyList.forEach(function (entry, index) {

        html += `
            <div class="history-item">

                <div class="history-number">
                    ${index + 1}
                </div>

                <div>
                    <span class="history-label">
                        What You're Selling
                    </span>

                    <span class="history-value">
                        ${escapeHtml(entry.product)}
                    </span>

                    <span class="difficulty-badge">
                        ${escapeHtml(entry.difficulty)}
                    </span>
                </div>

                <div class="history-customer">
                    <span class="history-label">
                        Who You're Selling To
                    </span>

                    <span class="history-value">
                        ${escapeHtml(entry.customer)}
                    </span>
                </div>

            </div>
        `;
    });

    historyArea.innerHTML = html;
}

function clearHistory() {

    historyList = [];

    localStorage.removeItem(
        "leafHomeSalesRandomizerHistory"
    );

    renderHistory();
}

function saveHistory() {

    localStorage.setItem(
        "leafHomeSalesRandomizerHistory",
        JSON.stringify(historyList)
    );
}

function loadHistory() {

    const savedHistory = localStorage.getItem(
        "leafHomeSalesRandomizerHistory"
    );

    if (!savedHistory) {
        return;
    }

    try {

        const parsedHistory = JSON.parse(savedHistory);

        if (Array.isArray(parsedHistory)) {
            historyList = parsedHistory.slice(0, 10);
        }

    } catch (error) {

        historyList = [];
    }
}

/*
Prevents an edited list entry from accidentally being
interpreted as HTML when displayed in the history.
*/

function escapeHtml(value) {

    const temporaryElement =
        document.createElement("div");

    temporaryElement.textContent = value;

    return temporaryElement.innerHTML;
}

loadHistory();
renderHistory();

</script>

</body>
</html>
